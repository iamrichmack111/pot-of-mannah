name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Nutrition, Diary, Food search, Planner, Progress, Themes, Docker, Developer experience]
