name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q pot_of_mannah mannah_web scripts
      - name: Verify food database
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect('pot_of_mannah/data/food.db')
          n=con.execute('select count(*) from food_data').fetchone()[0]
          print('foods:', n)
          assert n >= 7000
          PY

  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Flask route smoke test
        env:
          MANNAH_WEB_DB: /tmp/mannah-web-smoke.db
          SECRET_KEY: ci-smoke-secret
        run: |
          python - <<'PY'
          from mannah_web.app import app
          c=app.test_client()
          assert c.get('/healthz').status_code == 200
          assert c.get('/').status_code == 200
          assert c.get('/login').status_code == 200
          print(c.get('/healthz').get_json())
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pot-of-mannah:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
